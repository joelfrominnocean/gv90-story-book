<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 4 2266 160" width="2266" height="160"><style>.breath{animation:breath 6s ease-in-out infinite}@keyframes breath{0%,100%{opacity:.82}50%{opacity:1}}.sway{animation:sway 8s ease-in-out infinite}.sway.s2{animation-duration:9.5s;animation-delay:-2s}.sway.s3{animation-duration:7s;animation-delay:-4s}.sway.s4{animation-duration:10.5s;animation-delay:-1s}@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}.spin{animation:spin 1.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall .9s linear infinite}.fall.fb{animation-name:fallb;animation-duration:1.3s}@keyframes fall{to{transform:translateY(150px)}}@keyframes fallb{to{transform:translateY(190px)}}@media (prefers-reduced-motion:reduce){.breath,.sway,.spin,.fall{animation:none}}</style><defs>
  <linearGradient id="light-glowDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B15A" stop-opacity=".5"/><stop offset=".07" stop-color="#F4B15A" stop-opacity=".22"/><stop offset=".22" stop-color="#F4B15A" stop-opacity=".07"/><stop offset=".55" stop-color="#F4B15A" stop-opacity=".015"/><stop offset="1" stop-color="#F4B15A" stop-opacity="0"/></linearGradient>
  <linearGradient id="light-glowUp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F4B15A" stop-opacity=".26"/><stop offset=".25" stop-color="#F4B15A" stop-opacity=".07"/><stop offset="1" stop-color="#F4B15A" stop-opacity="0"/></linearGradient>
</defs><g style="mix-blend-mode:screen"><g class="breath">
  <rect x="-120" y="34" width="2266" height="130" fill="url(#light-glowDown)"/>
  <rect x="-120" y="4" width="2266" height="30" fill="url(#light-glowUp)"/></g></g><path d="M-120 34L2146 34" fill="none" stroke="#F4B15A" stroke-width="1.7" stroke-opacity="1" stroke-linecap="round"/><path d="M-120 34L2146 34" fill="none" stroke="#f2d3ad" stroke-width="0.55" stroke-opacity="0.9" stroke-linecap="round"/></svg>
